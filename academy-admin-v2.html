<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Academy Admin</title>
<style>

:root[data-theme="light"]{--bg:#f1f5f9;--sf:#fff;--sf2:#f3f6fa;--bd:#dbe2ec;--tx:#14202e;--mu:#52647a;--ac:#2a7d00;--ab:#e4f4da;--okb:#dff3d2;--okt:#1f6a00;--wb:#fff0cf;--wt:#7a4e00;--bb:#fde3e3;--bdt:#9b2222;--nb:#e8edf4;--nt:#3b4b60;--sb:rgba(255,255,255,.95);--g1:rgba(76,194,10,.12);--g2:rgba(99,70,230,.07);--sh:0 6px 18px rgba(20,32,46,.08);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:14px/1.5 Inter,system-ui,sans-serif;background:var(--bg);background-image:radial-gradient(900px 420px at 88% -60px,var(--g1),transparent 65%),radial-gradient(700px 420px at -5% 105%,var(--g2),transparent 65%);background-attachment:fixed;color:var(--tx)}
.app{display:flex;min-height:100vh}
.sb{width:240px;flex-shrink:0;background:var(--sb);border-right:1px solid var(--bd);padding:20px 12px;backdrop-filter:blur(8px)}
.lg{font-size:20px;font-weight:800;font-style:italic;margin:0 10px 10px;background:linear-gradient(90deg,#5fd01f,#2fb8a0);-webkit-background-clip:text;background-clip:text;color:transparent}

.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}

.btn,.b2{border-radius:10px;padding:9px 15px;font:600 14px Inter,sans-serif;min-height:40px;cursor:pointer;transition:transform .1s,box-shadow .15s}
.btn{background:var(--btg);color:#fff;border:0;box-shadow:0 4px 14px rgba(46,139,0,.45)}.btn:hover{transform:translateY(-1px)}
.b2{background:var(--sf2);color:var(--tx);border:1px solid var(--bd)}.b2:hover{border-color:var(--ac)}
.sm{min-height:32px;padding:5px 11px;font-size:13px}
.in,select,textarea{background:var(--sf2);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;color:var(--tx);font:14px Inter,sans-serif;min-height:40px;width:100%;min-width:0}
.in:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
label{display:block;font-size:12.5px;color:var(--mu);margin-top:10px}label .in,label select,label textarea{margin-top:5px;color:var(--tx)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;color:var(--mu);font-weight:500;padding:9px 8px;border-bottom:1px solid var(--bd)}
td{padding:11px 8px;border-bottom:1px solid var(--bd);vertical-align:middle}tr:hover td{background:var(--ab)}
.pl{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--nb);color:var(--nt)}
.pl.ok{background:var(--okb);color:var(--okt)}.pl.wn{background:var(--wb);color:var(--wt)}.pl.bd{background:var(--bb);color:var(--bdt)}
.bar{height:10px;border-radius:5px;background:linear-gradient(90deg,#2e8b00,#5fd01f);min-width:4px}
.sec{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-top:12px;background:var(--sf2)}
.lc{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}.lc .in{flex:1 1 180px;width:auto}.lc select,.lc .d{width:100px}
.fx{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.fx>.l{flex:2 1 520px}.fx>.r{flex:1 1 280px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));z-index:5}
.md{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:22px;width:100%;max-width:480px;max-height:100%;overflow:auto;box-shadow:var(--sh)}.md h2{margin:0 0 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ac);color:#06210a;font-weight:600;padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}.toast.show{opacity:1}
a{color:var(--ac)}
@media (max-width:800px){.app{flex-direction:column}.sb{width:100%;display:flex;overflow-x:auto;gap:4px;padding:10px;border-right:0;border-bottom:1px solid var(--bd)}.sb .gl,.sb .lg{display:none}.nv{white-space:nowrap}.tb,.ct{padding-left:14px;padding-right:14px}}
</style></head><body>

const ST={Draft:['Draft','Published','Archived']};
const F={
courses:[['title','Title','text'],['category','Category','sel','categories'],['instructor','Instructor','sel','instructors'],['level','Level','sel',['Beginner','Intermediate','Advanced']],['language','Language','sel',['English','Bangla','Hindi']],['price','Price (৳)','number'],['orig','Original price (৳)','number'],['badge','Badge','text'],['status','Status','sel',['Draft','Published','Archived']],['desc','Short description','area']],

playlists:[['title','Title','text'],['channel','Channel','text'],['category','Category','text'],['videos','Videos','number'],['url','YouTube URL','text'],['status','Status','sel',['Published','Draft']]],

orders:[['student','Student','text'],['course','Course','sel','courses'],['method','Method','sel',['bKash','Nagad','Stripe','Bank transfer','Razorpay']],['trx','Transaction ID','text'],['amount','Amount (৳)','number'],['date','Date','date'],['status','Status','sel',['Pending','Approved','Rejected']]],

blogs:[['title','Title','text'],['author','Author','text'],['tag','Tag','text'],['date','Date','date'],['status','Status','sel',['Published','Draft']]],
reviews:[['student','Student','text'],['course','Course','sel','courses'],['rating','Rating (1–5)','number'],['text','Review','area'],['status','Status','sel',['Approved','Pending','Hidden']]],
support:[['student','Student','text'],['subject','Subject','text'],['message','Message','area'],['status','Status','sel',['Open','Resolved']]]};

const GR=[['Overview',['dashboard']],['Learning',['courses','categories','live','playlists','notes']],['People',['students','instructors']],['Sales',['orders','coupons']],['Content',['blogs','reviews','support']],['System',['site']]];

function editor(){const c=S.courses.find(x=>x.id===cur);if(!c)return list('courses');const p=n=>`data-p="${n}"`;
return `<div class="tb"><div><a href="#courses">← Courses</a><h1>${esc(c.title)}</h1></div><div class="row">${pill(c.status)}<button class="b2" data-a="sv">Save draft</button><button class="btn" data-a="pub">Publish</button></div></div><div class="ct"><div class="fx"><div class="l"><div class="card"><h2>Basic info</h2>${F.courses.filter(f=>!['price','orig','status'].includes(f[0])).map(([n,l,t,o])=>`<label>${l}${fld(n,t,o,c[n],p(n))}</label>`).join('')}</div>
<div class="card"><div class="row" style="justify-content:space-between"><h2>Curriculum</h2><button class="b2 sm" data-a="asec">+ Add section</button></div>${c.sections.map((s,i)=>`<div class="sec"><div class="row"><input class="in" style="flex:1" aria-label="Section title" ${p('sections.'+i+'.t')} value="${esc(s.t)}"><button class="b2 sm" data-a="dsec" data-i="${i}">Remove section</button></div>${s.lectures.map((l,j)=>{const b='sections.'+i+'.lectures.'+j+'.';return `<div class="lc"><input class="in" aria-label="Lecture title" ${p(b+'t')} value="${esc(l.t)}"><select aria-label="Type" ${p(b+'type')}>${['Video','Note','Quiz'].map(x=>`<option${x===l.type?' selected':''}>${x}</option>`).join('')}</select><input class="in d" aria-label="Duration" placeholder="mm:ss" ${p(b+'dur')} value="${esc(l.dur)}"><label style="margin:0"><input type="checkbox" ${p(b+'free')}${l.free?' checked':''}> Free preview</label><button class="b2 sm" data-a="dlec" data-i="${i}" data-j="${j}">Remove</button></div>`}).join('')}<button class="b2 sm" style="margin-top:10px" data-a="alec" data-i="${i}">+ Add lecture</button></div>`).join('')||'<div class="mu">No sections yet.</div>'}</div></div>
<div class="r"><div class="card"><h2>Publish &amp; pricing</h2>${['status','price','orig'].map(n=>{const f=F.courses.find(x=>x[0]===n);return `<label>${f[1]}${fld(n,f[2],f[3],c[n],p(n))}</label>`}).join('')}</div></div></div></div>`}
function site(){const s=S.site,L={name:'Site name',banner:'Top banner text',whatsapp:'WhatsApp number',email:'Support email',payLink:'Backup payment link'};
return `<div class="tb"><h1>Site Settings</h1></div><div class="ct"><div class="card" style="max-width:560px"><form id="sf">${Object.keys(L).map(k=>`<label>${L[k]}<input class="in" name="${k}" value="${esc(s[k])}"></label>`).join('')}<div class="row" style="margin-top:16px"><button class="btn" type="submit">Save settings</button><button class="b2" type="button" data-a="theme">Toggle light/dark</button><button class="b2" type="button" data-a="reset">Reset demo data</button></div></form></div></div>`}
function render(){const h=(location.hash||'#dashboard').slice(1);let k=h;if(h.startsWith('course-')){cur=h.slice(7);k='editor'}else if(!PG[h])k='dashboard';
$('#nav').innerHTML='<div class="lg">Academy Admin</div>'+GR.map(g=>`<div class="gl">${g[0]}</div>${g[1].map(x=>`<a class="nv${(k===x||(k==='editor'&&x==='courses'))?' on':''}" href="#${x}">${PG[x][0]}</a>`).join('')}`).join('');
$('#v').innerHTML=k==='dashboard'?dash():k==='editor'?editor():k==='site'?site():list(k);window.scrollTo(0,0)}
function modal(h){$('#m').innerHTML=`<div class="ov"><div class="md" role="dialog" aria-modal="true">${h}</div></div>`}
const closeM=()=>$('#m').innerHTML='';
function toast(m){const t=$('#t');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
const setP=(o,p,v)=>{const a=p.split('.');while(a.length>1)o=o[a.shift()];o[a[0]]=v};
const refresh=k=>{save();render()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,id=b.dataset.id,c=S.courses.find(x=>x.id===cur),i=+b.dataset.i,j=+b.dataset.j;
if(a==='close')closeM();
else if(a==='add'){if(k==='courses'){const n={id:'c'+uid(),title:'Untitled course',category:S.categories[0].name,instructor:S.instructors[0].name,level:'Beginner',language:'English',price:0,orig:0,badge:'',status:'Draft',desc:'',sections:[]};S.courses.unshift(n);save();location.hash='#course-'+n.id}else modal(`<h2>Add ${PG[k][1]}</h2><form data-k="${k}">${F[k].map(([n,l,t,o])=>`<label>${l}${fld(n,t,o,'',`name="${n}"`)}</label>`).join('')}<div class="row" style="margin-top:16px"><button class="btn" type="submit">Save</button><button class="b2" type="button" data-a="close">Cancel</button></div></form>`)}
else if(a==='edit'){if(k==='courses')location.hash='#course-'+id;else{const r=S[k].find(x=>x.id===id);modal(`<h2>Edit ${PG[k][1]}</h2><form data-k="${k}" data-id="${id}">${F[k].map(([n,l,t,o])=>`<label>${l}${fld(n,t,o,r[n],`name="${n}"`)}</label>`).join('')}<div class="row" style="margin-top:16px"><button class="btn" type="submit">Save</button><button class="b2" type="button" data-a="close">Cancel</button></div></form>`)}}
else if(a==='del')modal(`<h2>Delete this ${PG[k][1]}?</h2><p class="mu">This cannot be undone.</p><div class="row"><button class="btn" data-a="del2" data-k="${k}" data-id="${id}">Delete</button><button class="b2" data-a="close">Cancel</button></div>`);
else if(a==='del2'){S[k]=S[k].filter(x=>x.id!==id);closeM();refresh();toast('Deleted')}
else if(a==='ap'||a==='rj'){const o=S.orders.find(x=>x.id===id);o.status=a==='ap'?'Approved':'Rejected';if(a==='ap'&&!S.students.some(s=>s.name===o.student))S.students.push({id:'s'+uid(),name:o.student,email:'',phone:'',joined:today(),status:'Active'});refresh();toast(a==='ap'?'Approved, student enrolled':'Order rejected')}
else if(a==='asec'){c.sections.push({t:'New section',lectures:[]});refresh()}
else if(a==='dsec'){c.sections.splice(i,1);refresh()}
else if(a==='alec'){c.sections[i].lectures.push({t:'New lecture',type:'Video',dur:'',free:false});refresh()}
else if(a==='dlec'){c.sections[i].lectures.splice(j,1);refresh()}
else if(a==='sv'){save();toast('Saved')}
else if(a==='pub'){c.status='Published';refresh();toast('Course published')}
else if(a==='theme'){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='light'?'dark':'light'}
else if(a==='reset'){S=seed();refresh();toast('Demo data restored')}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;if(f.id==='sf'){Object.assign(S.site,Object.fromEntries(new FormData(f)));save();toast('Settings saved');return}
const k=f.dataset.k,id=f.dataset.id,d=Object.fromEntries(new FormData(f));F[k].forEach(([n,,t])=>{if(t==='number')d[n]=Number(d[n]||0)});
if(id)Object.assign(S[k].find(x=>x.id===id),d);else S[k].unshift({id:uid(),...d});closeM();refresh();toast('Saved')});
const onP=e=>{const el=e.target;if(el.dataset&&el.dataset.p&&cur){const c=S.courses.find(x=>x.id===cur);let v=el.type==='checkbox'?el.checked:el.value;if(['price','orig'].includes(el.dataset.p))v=Number(v||0);setP(c,el.dataset.p,v);save()}
else if(el.id==='q'){Q[location.hash.slice(1)]=el.value;$('#tbl').innerHTML=tbl(location.hash.slice(1))}
else if(el.id==='fs'){FS[location.hash.slice(1)]=el.value;$('#tbl').innerHTML=tbl(location.hash.slice(1))}};
document.addEventListener('input',onP);document.addEventListener('change',onP);
addEventListener('hashchange',render);render();
</script></body></html>
